server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: venue-reservation-backend
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:venue_reservation}?useUnicode=true&characterEncoding=utf8&useSSL=false&connectionTimeZone=Asia/Shanghai&forceConnectionTimeZoneToSession=true&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:venue}
    password: ${MYSQL_PASSWORD:venue_password}
    hikari:
      data-source-properties:
        # JDBC owns session state; avoid a read-only status query before each statement.
        useLocalSessionState: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  community:
    retention:
      enabled: ${APP_COMMUNITY_RETENTION_ENABLED:true}
      initial-delay-ms: ${APP_COMMUNITY_RETENTION_INITIAL_DELAY_MS:300000}
      fixed-delay-ms: ${APP_COMMUNITY_RETENTION_FIXED_DELAY_MS:86400000}
      batch-size: ${APP_COMMUNITY_RETENTION_BATCH_SIZE:500}
      max-batches-per-run: ${APP_COMMUNITY_RETENTION_MAX_BATCHES_PER_RUN:20}
  jwt:
    issuer: venue-reservation-system
    secret: ${JWT_SECRET:change-this-development-secret-change-this-development-secret}
    access-token-minutes: ${JWT_ACCESS_TOKEN_MINUTES:120}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  upload:
    max-size-mb: ${UPLOAD_MAX_SIZE_MB:5}
    allowed-types: ${UPLOAD_ALLOWED_TYPES:image/png,image/jpeg,image/webp}
  payment:
    default-provider-key: ${APP_PAYMENT_DEFAULT_PROVIDER_KEY:payment.dev}
    callback-secret: ${PAYMENT_CALLBACK_SECRET:}
    alipay-sandbox:
      enabled: ${APP_PAYMENT_ALIPAY_SANDBOX_ENABLED:false}
      app-id: ${APP_PAYMENT_ALIPAY_SANDBOX_APP_ID:}
      app-private-key: ${APP_PAYMENT_ALIPAY_SANDBOX_APP_PRIVATE_KEY:}
      alipay-public-key: ${APP_PAYMENT_ALIPAY_SANDBOX_ALIPAY_PUBLIC_KEY:}
      gateway-url: ${APP_PAYMENT_ALIPAY_SANDBOX_GATEWAY_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
      notify-url: ${APP_PAYMENT_ALIPAY_SANDBOX_NOTIFY_URL:}
      return-url: ${APP_PAYMENT_ALIPAY_SANDBOX_RETURN_URL:}
  stored-value:
    provider:
      default-provider-key: ${APP_STORED_VALUE_DEFAULT_PROVIDER_KEY:stored-value.dev}
      recharge-enabled: ${APP_STORED_VALUE_RECHARGE_ENABLED:true}
      refund-enabled: ${APP_STORED_VALUE_REFUND_ENABLED:true}
      alipay-sandbox-enabled: ${APP_STORED_VALUE_ALIPAY_SANDBOX_ENABLED:false}
      alipay-sandbox-manual-confirmation: ${APP_STORED_VALUE_ALIPAY_SANDBOX_MANUAL_CONFIRMATION:false}
    bonus-expiry-fixed-delay-ms: ${APP_STORED_VALUE_BONUS_EXPIRY_FIXED_DELAY_MS:3600000}
    bonus-expiry-initial-delay-ms: ${APP_STORED_VALUE_BONUS_EXPIRY_INITIAL_DELAY_MS:60000}
  provider:
    observability:
      scheduled-enabled: ${APP_PROVIDER_OBSERVABILITY_SCHEDULED_ENABLED:true}
      scheduler-pool-size: ${APP_PROVIDER_OBSERVABILITY_SCHEDULER_POOL_SIZE:4}
      weather:
        enabled: ${APP_PROVIDER_OBSERVABILITY_WEATHER_ENABLED:true}
        initial-delay-ms: ${APP_PROVIDER_OBSERVABILITY_WEATHER_INITIAL_DELAY_MS:60000}
        fixed-delay-ms: ${APP_PROVIDER_OBSERVABILITY_WEATHER_FIXED_DELAY_MS:900000}
      risk:
        enabled: ${APP_PROVIDER_OBSERVABILITY_RISK_ENABLED:true}
        initial-delay-ms: ${APP_PROVIDER_OBSERVABILITY_RISK_INITIAL_DELAY_MS:30000}
        fixed-delay-ms: ${APP_PROVIDER_OBSERVABILITY_RISK_FIXED_DELAY_MS:300000}
      metrics:
        enabled: ${APP_PROVIDER_OBSERVABILITY_METRICS_ENABLED:true}
        initial-delay-ms: ${APP_PROVIDER_OBSERVABILITY_METRICS_INITIAL_DELAY_MS:15000}
        fixed-delay-ms: ${APP_PROVIDER_OBSERVABILITY_METRICS_FIXED_DELAY_MS:60000}
      retention:
        enabled: ${APP_PROVIDER_OBSERVABILITY_RETENTION_ENABLED:true}
        initial-delay-ms: ${APP_PROVIDER_OBSERVABILITY_RETENTION_INITIAL_DELAY_MS:300000}
        fixed-delay-ms: ${APP_PROVIDER_OBSERVABILITY_RETENTION_FIXED_DELAY_MS:86400000}
        snapshot-days: ${APP_PROVIDER_OBSERVABILITY_RETENTION_SNAPSHOT_DAYS:30}
        call-log-days: ${APP_PROVIDER_OBSERVABILITY_RETENTION_CALL_LOG_DAYS:30}
        batch-size: ${APP_PROVIDER_OBSERVABILITY_RETENTION_BATCH_SIZE:500}
        max-batches-per-run: ${APP_PROVIDER_OBSERVABILITY_RETENTION_MAX_BATCHES_PER_RUN:20}
  security:
    rate-limit-per-minute: ${RATE_LIMIT_PER_MINUTE:90}
    # 可信反向代理 IP/CIDR 列表，仅当请求直连地址属于此列表时才信任 X-Forwarded-For/X-Real-IP
    trusted-proxies: ${TRUSTED_PROXIES:127.0.0.1,::1}
  auth:
    password-reset:
      # DEV 止血闸门：开启后找回密码响应体返回 token 原文，便于联调闭环；生产环境必须关闭（false），改由通知渠道投递
      dev-token-delivery: ${APP_AUTH_PASSWORD_RESET_DEV_TOKEN_DELIVERY:false}
  notice:
    # 投递环境（DEV/STAGING/PROD），默认 DEV
    provider-env: ${APP_NOTICE_PROVIDER_ENV:DEV}
    # Mock 消息 Provider 是否激活，默认 true（开发/测试），生产环境设为 false 关闭
    mock-provider: ${APP_NOTICE_MOCK_PROVIDER:true}
    outbox:
      poll-delay-ms: ${APP_NOTICE_OUTBOX_POLL_DELAY_MS:5000}
      batch-size: ${APP_NOTICE_OUTBOX_BATCH_SIZE:50}
      lease-seconds: ${APP_NOTICE_OUTBOX_LEASE_SECONDS:60}
      max-attempts: ${APP_NOTICE_OUTBOX_MAX_ATTEMPTS:3}
      retry-base-seconds: ${APP_NOTICE_OUTBOX_RETRY_BASE_SECONDS:30}
    smtp:
      enabled: ${APP_NOTICE_SMTP_ENABLED:false}
      sandbox-only: ${APP_NOTICE_SMTP_SANDBOX_ONLY:true}
      host: ${APP_NOTICE_SMTP_HOST:127.0.0.1}
      port: ${APP_NOTICE_SMTP_PORT:1025}
      auth: ${APP_NOTICE_SMTP_AUTH:false}
      starttls: ${APP_NOTICE_SMTP_STARTTLS:false}
      username: ${APP_NOTICE_SMTP_USERNAME:}
      password: ${APP_NOTICE_SMTP_PASSWORD:}
      from-address: ${APP_NOTICE_SMTP_FROM_ADDRESS:no-reply@venue.local}
      from-name: ${APP_NOTICE_SMTP_FROM_NAME:Venue Reservation Sandbox}
      connect-timeout-ms: ${APP_NOTICE_SMTP_CONNECT_TIMEOUT_MS:3000}
      read-timeout-ms: ${APP_NOTICE_SMTP_READ_TIMEOUT_MS:5000}
      write-timeout-ms: ${APP_NOTICE_SMTP_WRITE_TIMEOUT_MS:5000}
    acceptance:
      fake-provider-enabled: ${APP_NOTICE_ACCEPTANCE_FAKE_PROVIDER_ENABLED:false}
      pause-after-provider-ms: ${APP_NOTICE_ACCEPTANCE_PAUSE_AFTER_PROVIDER_MS:0}

logging:
  level:
    com.example.venue: ${APP_LOG_LEVEL:INFO}
