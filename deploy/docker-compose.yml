services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.4}
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-root_password}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-venue_reservation}"
      MYSQL_USER: "${MYSQL_USER:-venue}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-venue_password}"
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 3s
      timeout: 3s
      retries: 40
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --log-bin-trust-function-creators=${MYSQL_LOG_BIN_TRUST_FUNCTION_CREATORS:-1}

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"

  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.30.4}
    environment:
      MP_DATABASE: /data/mailpit.db
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    volumes:
      - mailpit-data:/data

  backend:
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8080;
          printf "GET /actuator/health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3;
          cat <&3 | grep -q "\"status\":\"UP\""'
      interval: 3s
      timeout: 5s
      start_period: 10s
      retries: 60
    build:
      context: ../backend
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9.9-eclipse-temurin-17}
        JRE_IMAGE: ${JRE_IMAGE:-eclipse-temurin:17-jre}
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-}
    environment:
      # A26-P3-09：backend 容器与 mysql 同步使用 Asia/Shanghai，
      # 使 LocalDateTime.now()（JVM 默认时区）与对账按 Asia/Shanghai 切日的窗口对齐，
      # 避免北京时间 00:00-08:00 支付在两个日期各产生一条假差异。
      TZ: Asia/Shanghai
      # Docker 默认按生产语义校验：未配置真实 JWT_SECRET 时后端启动直接失败（闭合 AUD-P0-01）。
      # 本地容器联调可在外层 .env.local 设 SPRING_PROFILES_ACTIVE=dev 放行开发密钥。
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-prod}"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-venue_reservation}"
      MYSQL_USER: "${MYSQL_USER:-venue}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-venue_password}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # 不再注入仓库内固定 fallback：未提供 JWT_SECRET 时留空，由后端 validateSecret 在 prod profile 下 fail-fast。
      JWT_SECRET: "${JWT_SECRET:-}"
      JWT_ACCESS_TOKEN_MINUTES: "${JWT_ACCESS_TOKEN_MINUTES:-120}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1}"
      PAYMENT_CALLBACK_SECRET: "${PAYMENT_CALLBACK_SECRET:-}"
      APP_PAYMENT_DEFAULT_PROVIDER_KEY: "${APP_PAYMENT_DEFAULT_PROVIDER_KEY:-payment.dev}"
      APP_PAYMENT_ALIPAY_SANDBOX_ENABLED: "${APP_PAYMENT_ALIPAY_SANDBOX_ENABLED:-false}"
      APP_PAYMENT_ALIPAY_SANDBOX_APP_ID: "${APP_PAYMENT_ALIPAY_SANDBOX_APP_ID:-}"
      APP_PAYMENT_ALIPAY_SANDBOX_APP_PRIVATE_KEY: "${APP_PAYMENT_ALIPAY_SANDBOX_APP_PRIVATE_KEY:-}"
      APP_PAYMENT_ALIPAY_SANDBOX_ALIPAY_PUBLIC_KEY: "${APP_PAYMENT_ALIPAY_SANDBOX_ALIPAY_PUBLIC_KEY:-}"
      APP_PAYMENT_ALIPAY_SANDBOX_GATEWAY_URL: "${APP_PAYMENT_ALIPAY_SANDBOX_GATEWAY_URL:-https://openapi-sandbox.dl.alipaydev.com/gateway.do}"
      APP_PAYMENT_ALIPAY_SANDBOX_NOTIFY_URL: "${APP_PAYMENT_ALIPAY_SANDBOX_NOTIFY_URL:-}"
      APP_PAYMENT_ALIPAY_SANDBOX_RETURN_URL: "${APP_PAYMENT_ALIPAY_SANDBOX_RETURN_URL:-}"
      APP_COMMUNITY_RETENTION_ENABLED: "${APP_COMMUNITY_RETENTION_ENABLED:-true}"
      APP_COMMUNITY_RETENTION_INITIAL_DELAY_MS: "${APP_COMMUNITY_RETENTION_INITIAL_DELAY_MS:-300000}"
      APP_COMMUNITY_RETENTION_FIXED_DELAY_MS: "${APP_COMMUNITY_RETENTION_FIXED_DELAY_MS:-86400000}"
      APP_COMMUNITY_RETENTION_BATCH_SIZE: "${APP_COMMUNITY_RETENTION_BATCH_SIZE:-500}"
      APP_COMMUNITY_RETENTION_MAX_BATCHES_PER_RUN: "${APP_COMMUNITY_RETENTION_MAX_BATCHES_PER_RUN:-20}"
      UPLOAD_MAX_SIZE_MB: "${UPLOAD_MAX_SIZE_MB:-5}"
      UPLOAD_ALLOWED_TYPES: "${UPLOAD_ALLOWED_TYPES:-image/png,image/jpeg,image/webp}"
      RATE_LIMIT_PER_MINUTE: "${RATE_LIMIT_PER_MINUTE:-90}"
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-172.16.0.0/12}"
      APP_LOG_LEVEL: "${APP_LOG_LEVEL:-INFO}"
      APP_PROVIDER_OBSERVABILITY_SCHEDULED_ENABLED: "${APP_PROVIDER_OBSERVABILITY_SCHEDULED_ENABLED:-true}"
      APP_PROVIDER_OBSERVABILITY_SCHEDULER_POOL_SIZE: "${APP_PROVIDER_OBSERVABILITY_SCHEDULER_POOL_SIZE:-4}"
      APP_PROVIDER_OBSERVABILITY_WEATHER_ENABLED: "${APP_PROVIDER_OBSERVABILITY_WEATHER_ENABLED:-true}"
      APP_PROVIDER_OBSERVABILITY_WEATHER_INITIAL_DELAY_MS: "${APP_PROVIDER_OBSERVABILITY_WEATHER_INITIAL_DELAY_MS:-60000}"
      APP_PROVIDER_OBSERVABILITY_WEATHER_FIXED_DELAY_MS: "${APP_PROVIDER_OBSERVABILITY_WEATHER_FIXED_DELAY_MS:-900000}"
      APP_PROVIDER_OBSERVABILITY_RISK_ENABLED: "${APP_PROVIDER_OBSERVABILITY_RISK_ENABLED:-true}"
      APP_PROVIDER_OBSERVABILITY_RISK_INITIAL_DELAY_MS: "${APP_PROVIDER_OBSERVABILITY_RISK_INITIAL_DELAY_MS:-30000}"
      APP_PROVIDER_OBSERVABILITY_RISK_FIXED_DELAY_MS: "${APP_PROVIDER_OBSERVABILITY_RISK_FIXED_DELAY_MS:-300000}"
      APP_PROVIDER_OBSERVABILITY_METRICS_ENABLED: "${APP_PROVIDER_OBSERVABILITY_METRICS_ENABLED:-true}"
      APP_PROVIDER_OBSERVABILITY_METRICS_INITIAL_DELAY_MS: "${APP_PROVIDER_OBSERVABILITY_METRICS_INITIAL_DELAY_MS:-15000}"
      APP_PROVIDER_OBSERVABILITY_METRICS_FIXED_DELAY_MS: "${APP_PROVIDER_OBSERVABILITY_METRICS_FIXED_DELAY_MS:-60000}"
      APP_PROVIDER_OBSERVABILITY_RETENTION_ENABLED: "${APP_PROVIDER_OBSERVABILITY_RETENTION_ENABLED:-true}"
      APP_PROVIDER_OBSERVABILITY_RETENTION_INITIAL_DELAY_MS: "${APP_PROVIDER_OBSERVABILITY_RETENTION_INITIAL_DELAY_MS:-300000}"
      APP_PROVIDER_OBSERVABILITY_RETENTION_FIXED_DELAY_MS: "${APP_PROVIDER_OBSERVABILITY_RETENTION_FIXED_DELAY_MS:-86400000}"
      APP_PROVIDER_OBSERVABILITY_RETENTION_SNAPSHOT_DAYS: "${APP_PROVIDER_OBSERVABILITY_RETENTION_SNAPSHOT_DAYS:-30}"
      APP_PROVIDER_OBSERVABILITY_RETENTION_CALL_LOG_DAYS: "${APP_PROVIDER_OBSERVABILITY_RETENTION_CALL_LOG_DAYS:-30}"
      APP_PROVIDER_OBSERVABILITY_RETENTION_BATCH_SIZE: "${APP_PROVIDER_OBSERVABILITY_RETENTION_BATCH_SIZE:-500}"
      APP_PROVIDER_OBSERVABILITY_RETENTION_MAX_BATCHES_PER_RUN: "${APP_PROVIDER_OBSERVABILITY_RETENTION_MAX_BATCHES_PER_RUN:-20}"
      APP_NOTICE_OUTBOX_POLL_DELAY_MS: "${APP_NOTICE_OUTBOX_POLL_DELAY_MS:-5000}"
      APP_NOTICE_OUTBOX_BATCH_SIZE: "${APP_NOTICE_OUTBOX_BATCH_SIZE:-50}"
      APP_NOTICE_OUTBOX_LEASE_SECONDS: "${APP_NOTICE_OUTBOX_LEASE_SECONDS:-60}"
      APP_NOTICE_OUTBOX_MAX_ATTEMPTS: "${APP_NOTICE_OUTBOX_MAX_ATTEMPTS:-3}"
      APP_NOTICE_OUTBOX_RETRY_BASE_SECONDS: "${APP_NOTICE_OUTBOX_RETRY_BASE_SECONDS:-30}"
      APP_NOTICE_SMTP_ENABLED: "${APP_NOTICE_SMTP_ENABLED:-false}"
      APP_NOTICE_SMTP_SANDBOX_ONLY: "${APP_NOTICE_SMTP_SANDBOX_ONLY:-true}"
      APP_NOTICE_SMTP_HOST: mailpit
      APP_NOTICE_SMTP_PORT: "1025"
      APP_NOTICE_SMTP_AUTH: "${APP_NOTICE_SMTP_AUTH:-false}"
      APP_NOTICE_SMTP_STARTTLS: "${APP_NOTICE_SMTP_STARTTLS:-false}"
      APP_NOTICE_SMTP_USERNAME: "${APP_NOTICE_SMTP_USERNAME:-}"
      APP_NOTICE_SMTP_PASSWORD: "${APP_NOTICE_SMTP_PASSWORD:-}"
      APP_NOTICE_SMTP_FROM_ADDRESS: "${APP_NOTICE_SMTP_FROM_ADDRESS:-no-reply@venue.local}"
      APP_NOTICE_SMTP_FROM_NAME: "${APP_NOTICE_SMTP_FROM_NAME:-Venue Reservation Sandbox}"
      APP_NOTICE_SMTP_CONNECT_TIMEOUT_MS: "${APP_NOTICE_SMTP_CONNECT_TIMEOUT_MS:-3000}"
      APP_NOTICE_SMTP_READ_TIMEOUT_MS: "${APP_NOTICE_SMTP_READ_TIMEOUT_MS:-5000}"
      APP_NOTICE_SMTP_WRITE_TIMEOUT_MS: "${APP_NOTICE_SMTP_WRITE_TIMEOUT_MS:-5000}"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  nginx:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.29-alpine}
    ports:
      - "127.0.0.1:${NGINX_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
  mailpit-data:
